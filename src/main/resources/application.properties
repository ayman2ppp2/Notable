# ---------- PostgreSQL connection ----------
spring.datasource.url=jdbc:postgresql://localhost:5432/notable
spring.datasource.username=${DB_USERNAME:notable}
spring.datasource.password=${DB_PASSWORD:notable}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ---------- Custom JWT settings (read later by JwtService) ----------
app.jwt.secret=${JWT_SECRET:this-is-a-dev-secret-replace-it-with-64-random-characters}
app.jwt.expiration-ms=86400000
